<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Sample certificate placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="#fdfcf8"/>
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="url(#g)" stroke-width="8"/>
  <rect x="38" y="38" width="724" height="484" fill="none" stroke="#d6d3c4" stroke-width="1.5"/>
  <text x="400" y="130" font-family="Georgia, serif" font-size="44" text-anchor="middle" fill="#1f1f2e">Certificate of Completion</text>
  <text x="400" y="190" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#6b6b80">This is to certify that</text>
  <text x="400" y="260" font-family="Georgia, serif" font-size="40" font-style="italic" text-anchor="middle" fill="#6d28d9">Your Name</text>
  <line x1="220" y1="280" x2="580" y2="280" stroke="#c9c6b8"/>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#6b6b80">has successfully completed the course</text>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f1f2e">Replace with your certificate image</text>
  <circle cx="400" cy="450" r="38" fill="url(#g)"/>
  <text x="400" y="458" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">★</text>
</svg>
